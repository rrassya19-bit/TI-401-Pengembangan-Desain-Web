<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pertemuan 5 - CSS Layout (Flexbox & Grid)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CSS Layout: Flexbox & Grid</h1>

  <!-- ===== DEMO 1: FLEXBOX untuk navbar ===== -->
  <h2>1. Flexbox — Navbar</h2>
  <nav class="navbar">
    <div class="logo">MyLogo</div>
    <ul class="nav-links">
      <li><a href="#">Beranda</a></li>
      <li><a href="#">Produk</a></li>
      <li><a href="#">Kontak</a></li>
    </ul>
  </nav>

  <!-- ===== DEMO 2: FLEXBOX untuk baris kartu ===== -->
  <h2>2. Flexbox — Baris Kartu (wrap otomatis)</h2>
  <div class="card-row">
    <div class="card">Kartu 1</div>
    <div class="card">Kartu 2</div>
    <div class="card">Kartu 3</div>
    <div class="card">Kartu 4</div>
  </div>

  <!-- ===== DEMO 3: CSS GRID untuk dashboard ===== -->
  <h2>3. CSS Grid — Layout Dashboard</h2>
  <div class="dashboard">
    <header class="area-header">Header</header>
    <aside class="area-sidebar">Sidebar</aside>
    <main class="area-main">Konten Utama</main>
    <footer class="area-footer">Footer</footer>
  </div>

</body>
</html>
